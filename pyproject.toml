[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "soxai_data"
version = "0.1.0"
dependencies = [
  "httpx",
  "pandas",
  "schedule",
]
requires-python = ">=3.8"
authors = [
  {name = "SOXAI Inc.", email = "dev@soxai.co.jp"}
]
maintainers = [
 {name = "SOXAI Inc.", email = "dev@soxai.co.jp"}
]
description = "SOXAI Data Science Library"
readme = "README.md"
license = {file = "LICENSE.txt"}
keywords = ["soxai_data", "soxai-data", "soxai", "data", "science"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
]

[project.urls]
Homepage = "https://soxai.co.jp"
Documentation = "https://soxai.co.jp/docs"
Repository = "https://github.com/soxaidev/soxai_data"
"Bug Tracker" = "https://github.com/soxaidev/soxai_data/issues"
Changelog = "https://github.com/soxaidev/soxai_data/blob/main/CHANGELOG.md"

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]
# a bare `pytest` run stays offline; use `pytest -m integration` for the live tests
addopts = "-m 'not integration'"
markers = [
  "integration: tests that call the real SOXAI web api (skipped without credentials)",
]
