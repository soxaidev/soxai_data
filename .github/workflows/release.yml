name: Release

on:
  push:
    branches:
      - release

jobs:
  release:
    name: Tag, release, and publish the version in pyproject.toml
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    environment:
      name: pypi
      url: https://pypi.org/p/soxai_data
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read the version to release
        id: version
        run: |
          VERSION=$(grep -E '^[[:space:]]*version[[:space:]]*=' pyproject.toml | sed -E 's/.*version[[:space:]]*=[[:space:]]*"([^"]*)".*/\1/')
          if [ -z "$VERSION" ]; then
            echo "Error: Failed to parse version from pyproject.toml" >&2
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Releasing v$VERSION as declared in pyproject.toml"

      - name: Fail if the version was already released
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Error: $TAG already exists. Bump the version in pyproject.toml and" >&2
            echo "add the matching section to CHANGELOG.md before releasing again." >&2
            exit 1
          fi

      - name: Extract the release notes from CHANGELOG.md
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          awk -v needle="## [$VERSION]" '
            index($0, needle) == 1 { found = 1; next }
            found && index($0, "## [") == 1 { exit }
            found && $0 ~ /^\[[^]]+\]:/ { exit }
            found { print }
          ' CHANGELOG.md | awk 'NF || started { started = 1; print }' > release_notes.md
          if ! grep -q '[^[:space:]]' release_notes.md; then
            echo "Error: CHANGELOG.md has no section for $VERSION." >&2
            echo "Add a '## [$VERSION] - YYYY-MM-DD' section before releasing." >&2
            exit 1
          fi
          echo "Release notes for v$VERSION:"
          cat release_notes.md

      - name: Create and push tag
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --title "v${{ steps.version.outputs.version }}" \
            --notes-file release_notes.md

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build distribution 📦
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install build
          python3 -m build

      - name: Publish distribution 📦 to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
