name: Test

on:
  pull_request:
    branches:
      - main
      - release
  push:
    branches:
      - main

# a new push to the same branch supersedes the run of the previous one
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: pytest (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # report every version that fails, not only the first one
      fail-fast: false
      matrix:
        # the lowest version pyproject.toml supports, and the newest released one
        python-version: ["3.9", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install the package and its test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run the offline test suite
        # addopts in pyproject.toml deselects the integration tests, so this run needs
        # no network and no credentials
        run: pytest
